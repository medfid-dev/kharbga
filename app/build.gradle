plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kharbga.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.kharbga.game"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
